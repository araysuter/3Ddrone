name: local-aerial-mapper

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          device_ids: ["0"]
          capabilities: [gpu]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-service-security: &service-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  odm-gpu:
    profiles: ["build-only"]
    image: local-aerial-mapper/odm:3.6.0-gpu
    build:
      context: .
      dockerfile: gpu.Dockerfile

  data-init:
    image: local-aerial-mapper/nodeodm:2.2.3-odm3.6.0
    user: "0:0"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        uid="$${MAPPER_UID}"
        gid="$${MAPPER_GID}"
        marker="/data/.ownership-$${uid}-$${gid}"
        install -d -m 0770 \
          /data/source \
          /data/nodeodm \
          /data/splat \
          /data/splat/home \
          /data/metadata \
          /data/logs \
          /data/logs/nodeodm \
          /data/uploads
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /data
          touch "$${marker}"
        fi
        chown "$${uid}:$${gid}" \
          /data \
          /data/source \
          /data/nodeodm \
          /data/splat \
          /data/splat/home \
          /data/metadata \
          /data/logs \
          /data/logs/nodeodm \
          /data/uploads
    environment:
      MAPPER_UID: ${MAPPER_UID:-1000}
      MAPPER_GID: ${MAPPER_GID:-1000}
    volumes:
      - ${MAPPER_DATA_DIR:?Set MAPPER_DATA_DIR in .env}:/data
    restart: "no"
    logging: *default-logging

  nodeodm:
    image: local-aerial-mapper/nodeodm:2.2.3-odm3.6.0
    build:
      context: .
      dockerfile: docker/nodeodm.Dockerfile
      args:
        MAPPER_UID: ${MAPPER_UID:-1000}
        MAPPER_GID: ${MAPPER_GID:-1000}
    command:
      - --config
      - /var/www/local-mapper-config.json
      - --port
      - "3000"
      - --parallel_queue_processing
      - "1"
      - --cleanup_tasks_after
      # NodeODM treats 0 as "delete immediately", not "disabled". One hundred
      # years is effectively disabled while retaining the standard API.
      - ${NODEODM_TASK_RETENTION_MINUTES:-52560000}
      - --cleanup_uploads_after
      - "10080"
      - --token
      - ${NODEODM_TOKEN:?Set NODEODM_TOKEN in .env}
    environment:
      NODEODM_TOKEN: ${NODEODM_TOKEN:?Set NODEODM_TOKEN in .env}
    volumes:
      - ${MAPPER_DATA_DIR:?Set MAPPER_DATA_DIR in .env}/nodeodm:/var/www/data
      - ${MAPPER_DATA_DIR:?Set MAPPER_DATA_DIR in .env}/logs/nodeodm:/var/www/logs
    deploy:
      <<: *gpu
    depends_on:
      data-init:
        condition: service_completed_successfully
    shm_size: "2gb"
    stop_grace_period: 2m
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-internal]

  splat-worker:
    image: local-aerial-mapper/splat:nerfstudio-1.1.5
    build:
      context: .
      dockerfile: services/splat/Dockerfile
    environment:
      MAPPER_INTERNAL_TOKEN: ${MAPPER_INTERNAL_TOKEN:?Set MAPPER_INTERNAL_TOKEN in .env}
      MAPPER_DATA_ROOT: /data
      SPLAT_STATE_ROOT: /data/splat
      HOME: /data/splat/home
      XDG_CACHE_HOME: /data/splat/home/.cache
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    user: "${MAPPER_UID:-1000}:${MAPPER_GID:-1000}"
    volumes:
      - ${MAPPER_DATA_DIR:?Set MAPPER_DATA_DIR in .env}:/data
    deploy:
      <<: *gpu
    depends_on:
      data-init:
        condition: service_completed_successfully
    shm_size: "1gb"
    stop_grace_period: 2m
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-internal]

  api:
    image: local-aerial-mapper/api:0.1.0
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      MAPPER_DATA_ROOT: /data
      MAPPER_INTERNAL_TOKEN: ${MAPPER_INTERNAL_TOKEN:?Set MAPPER_INTERNAL_TOKEN in .env}
      MAPPER_COOKIE_SECURE: ${MAPPER_COOKIE_SECURE:-true}
      MAPPER_SESSION_HOURS: ${MAPPER_SESSION_HOURS:-24}
      MAPPER_DISK_RESERVE_BYTES: ${MAPPER_DISK_RESERVE_BYTES:-5368709120}
      MAPPER_SHARING_ENABLED: ${MAPPER_SHARING_ENABLED:-false}
      MAPPER_PUBLIC_BASE_URL: ${MAPPER_PUBLIC_BASE_URL:-https://dronemaps.ashersuter.com}
      HOME: /tmp
      NODEODM_URL: http://nodeodm:3000
      NODEODM_TOKEN: ${NODEODM_TOKEN:?Set NODEODM_TOKEN in .env}
      SPLAT_URL: http://splat-worker:8090
    user: "${MAPPER_UID:-1000}:${MAPPER_GID:-1000}"
    volumes:
      - ${MAPPER_DATA_DIR:?Set MAPPER_DATA_DIR in .env}:/data
    depends_on:
      nodeodm:
        condition: service_healthy
      splat-worker:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-internal]

  frontend:
    image: local-aerial-mapper/frontend:0.1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: operator-runtime
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-edge, mapper-internal]

  public-gateway:
    profiles: ["sharing"]
    image: local-aerial-mapper/public-gateway:0.1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: public-runtime
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-public, mapper-internal]

  cloudflared:
    profiles: ["sharing"]
    image: cloudflare/cloudflared:2026.7.2
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      public-gateway:
        condition: service_healthy
    read_only: true
    restart: unless-stopped
    logging: *default-logging
    <<: *service-security
    networks: [mapper-public]

networks:
  mapper-edge:
  mapper-public:
  mapper-internal:
    internal: true
